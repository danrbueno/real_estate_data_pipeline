name: Release Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scraper-test-and-coverage:
    name: Scraper tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r config/requirements.txt
      - name: Enforce full coverage
        run: python -m pytest -c app/pytest.ini